# FB15k-237 (1 GPU)
# Usage: python train.py --config configs/fb15k-237.yaml

data_path: ./data/fb15k-237
devices: 1
node_ratio: 0.1
degree_ratio: 1.0
dependent: true
remove_one_hop: true
num_negative: 32
neg_visited: 64
adversarial_temperature: 0.5
batch_size: 8
test_batch_size: 8
max_epochs: 30
seed: 42
checkpoint_save_path: ./experiments/fb15k-237
num_layer: 6
hidden_dim: 32
num_heads: 8
drop: 0.0
global_channel: tokens
num_tokens: 32
learning_rate: 0.001
weight_decay: 0.0001
